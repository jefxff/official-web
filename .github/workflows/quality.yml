name: quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Schema behavior test
        run: npm run test:schema

      - name: Storage & SigV4 test
        run: npm run test:storage

      - name: Content (Markdown / i18n) test
        run: npm run test:content

      - name: Observability (APM envelope) test
        run: npm run test:observability

      - name: Inquiry persistence & rate limit test
        run: npm run test:contact

      - name: Dependency security gate
        run: npm run audit

      - name: Build (cn target)
        run: npm run build
        env:
          BUILD_TARGET: cn
          NEXT_PUBLIC_SITE_URL: https://www.fmw.example
